# Project-scoped Codex defaults. They load only in a trusted project and apply when
# a new local task begins; an explicit model selection still takes precedence.
model = "gpt-5.6-terra"
model_reasoning_effort = "medium"

[agents]
# Most delegated work in this repository should be bounded, repeatable, and
# evidence-returning. Workflow-specific reviewers override these defaults.
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"
max_concurrent_threads_per_session = 1
